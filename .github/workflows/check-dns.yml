name: Vérifier les DNS (ancrage.xyz)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Lister les enregistrements DNS Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, urllib.error
          TOKEN = os.environ["VERCEL_TOKEN"]; TEAM = "team_Gk17lZmjSWqGtF6aE5W89x9A"; DOMAIN = "ancrage.xyz"
          url = f"https://api.vercel.com/v4/domains/{DOMAIN}/records?teamId={TEAM}&limit=100"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {TOKEN}"})
          try:
              with urllib.request.urlopen(req) as r:
                  data = json.loads(r.read())
          except urllib.error.HTTPError as e:
              print("Erreur:", e.code, e.read().decode()); raise SystemExit(1)
          recs = data.get("records", [])
          print(f"Total: {len(recs)} enregistrements\n")
          for rec in recs:
              name = rec.get("name", "")
              if "contact" in name or name in ("", "@"):
                  val = rec.get("value", "")
                  print(f"[{rec.get('type'):4s}] {name:32s} -> {val[:90]}")
          PYEOF
