name: Campagne 1er mois à 1 €

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Adresse de test (envoie 1 seul mail et affiche l’erreur Resend). Vide = vraie campagne.'
        required: false
        default: ''

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Pull CRON_SECRET from Vercel
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel
          printf '{"projectId":"prj_3upPIEWu1x6wzrwU4AlLVKKGXdcJ","orgId":"team_Gk17lZmjSWqGtF6aE5W89x9A"}' > .vercel/project.json
          vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
          CRON=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2- | tr -d '"')
          echo "::add-mask::$CRON"
          echo "CRON=$CRON" >> $GITHUB_ENV

      - name: Envoyer la campagne
        run: |
          URL="https://ancrage.xyz/api/admin/launch-offer"
          if [ -n "${{ github.event.inputs.test }}" ]; then
            URL="$URL?test=${{ github.event.inputs.test }}"
          fi
          curl -sS "$URL" -H "Authorization: Bearer $CRON" | python3 -m json.tool
