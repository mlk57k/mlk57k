name: Test coach reply format

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Pull ANTHROPIC_API_KEY from Vercel
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel
          printf '{"projectId":"prj_3upPIEWu1x6wzrwU4AlLVKKGXdcJ","orgId":"team_Gk17lZmjSWqGtF6aE5W89x9A"}' > .vercel/project.json
          vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
          KEY=$(grep '^ANTHROPIC_API_KEY=' .env.local | cut -d= -f2- | tr -d '"')
          echo "::add-mask::$KEY"
          echo "ANTHROPIC_API_KEY=$KEY" >> $GITHUB_ENV

      - name: Generate test reply
        run: npx tsx scripts/test-coach.ts
