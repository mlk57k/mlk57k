name: Relance des inactifs (24h)

on:
  workflow_dispatch:
    inputs:
      all:
        description: "Rattrapage : relancer TOUS les inactifs 24h+ (sinon seulement la tranche 24-48h)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Pull CRON_SECRET from Vercel
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel
          printf '{"projectId":"prj_3upPIEWu1x6wzrwU4AlLVKKGXdcJ","orgId":"team_Gk17lZmjSWqGtF6aE5W89x9A"}' > .vercel/project.json
          vercel env pull .env.local --yes --token=${{ secrets.VERCEL_TOKEN }}
          CRON=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2- | tr -d '"')
          echo "::add-mask::$CRON"
          echo "CRON=$CRON" >> $GITHUB_ENV

      - name: Envoyer la relance
        run: |
          URL="https://ancrage.xyz/api/cron/inactive-reminder"
          if [ "${{ github.event.inputs.all }}" = "true" ]; then
            URL="$URL?all=1"
          fi
          curl -sS "$URL" -H "Authorization: Bearer $CRON" | python3 -m json.tool
